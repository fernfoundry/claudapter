<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Claudapter — OpenAI models in Claude Code</title>
  <desc id="desc">A local adapter translates Anthropic Messages into OpenAI Responses. Bring your own API key.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dedbd4"/></pattern>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#f1eee7"/></linearGradient>
  </defs>
  <rect width="1280" height="360" rx="24" fill="#f7f5ef"/>
  <rect x="820" width="460" height="360" fill="url(#grid)"/>
  <path d="M0 336H1280" stroke="#ddd9d0"/>
  <text x="64" y="57" font-family="monospace" font-size="13" letter-spacing="2.5" fill="#857d70">MESSAGES → RESPONSES</text>
  <text x="60" y="151" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-4" fill="#252b29">Claudapter<tspan fill="#d26d48">.</tspan></text>
  <text x="64" y="205" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="25" fill="#505751">OpenAI models in Claude Code.</text>
  <text x="64" y="247" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" fill="#777b73">Your API key. One local protocol adapter.</text>
  <text x="64" y="312" font-family="monospace" font-size="12" letter-spacing="1" fill="#857d70">LOCALHOST ONLY  /  NO NPM OR PIP DEPENDENCIES  /  MIT</text>
  <g transform="translate(870 84)">
    <path d="M-20 96H30M246 96H300" fill="none" stroke="#c4bfb4" stroke-width="3"/>
    <circle cx="-20" cy="96" r="6" fill="#d26d48"/>
    <circle cx="300" cy="96" r="6" fill="#517968"/>
    <rect x="30" y="10" width="216" height="174" rx="25" fill="#e4dfd4"/>
    <rect x="30" y="0" width="216" height="174" rx="25" fill="url(#surface)" stroke="#c9c3b6" stroke-width="1.5"/>
    <rect x="51" y="21" width="174" height="132" rx="13" fill="#252f2b"/>
    <path d="M98 58L76 87L98 116M178 58L200 87L178 116" fill="none" stroke="#e9e6dc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M114 87H162M150 75L162 87L150 99" fill="none" stroke="#e69b72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="65" cy="139" r="3" fill="#84b99d"/>
    <text x="80" y="143" font-family="monospace" font-size="10" letter-spacing="1" fill="#bdc8bf">127.0.0.1</text>
    <text x="138" y="226" text-anchor="middle" font-family="monospace" font-size="12" letter-spacing="1" fill="#777d73">THE ADAPTER STAYS LOCAL</text>
